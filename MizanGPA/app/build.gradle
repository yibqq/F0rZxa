plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mizan.gpa'
    compileSdk 36

    defaultConfig {
        applicationId 'com.mizan.gpa'
        minSdk 26
        targetSdk 36
        versionCode 6
        versionName '1.0.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Signed with the debug key so the release APK installs directly.
            // Replace with your own signingConfig before publishing to a store.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding false
        buildConfig true
    }

    androidResources {
        generateLocaleConfig true
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
            all {
                maxHeapSize = '3g'
                systemProperty 'screenshots.dir', "${rootDir}/screenshots"
            }
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.core:core:1.17.0'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20250517'
    testImplementation 'org.robolectric:robolectric:4.17'
    testImplementation 'androidx.test:core:1.7.0'
}
